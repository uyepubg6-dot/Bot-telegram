name = "tele-bot-worker"
main = "workers/worker.js"
compatibility_date = "2024-11-08"

[vars]
# Atur di dashboard/CLI sebagai Secrets (lebih aman):
# TELEGRAM_TOKEN = ""
# WEBHOOK_SECRET = ""
# ADMIN_ID = ""  # optional: id angka Telegram untuk restrict /addcmd /delcmd

# KV namespaces (buat via dashboard atau CLI, lalu isi id di sini)
# CLI contoh:
#   wrangler kv:namespace create COMMANDS
#   wrangler kv:namespace create COMMANDS --preview
# Lalu isi id / preview_id di bawah.
[[kv_namespaces]]
binding = "COMMANDS"
id = "REPLACE_WITH_YOUR_PRODUCTION_KV_ID"
preview_id = "REPLACE_WITH_YOUR_PREVIEW_KV_ID"